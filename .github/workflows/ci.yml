name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck tmux zsh
      - name: deps (macos)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck tmux
      - run: make check
