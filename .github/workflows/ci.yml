name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats parallel shellcheck tmux zsh
      # lint is OS-independent and runs on ubuntu only, so macOS skips shellcheck
      - name: deps (macos)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install bats-core parallel tmux
      - name: jobs sweep
        run: |
          for j in 3 4 6 8 3 4 6 8; do
            s=$(date +%s); bats --jobs $j test/ >out.tap 2>&1; rc=$?
            echo "SWEEP jobs=$j rc=$rc $(( $(date +%s) - s ))s notok=$(grep -c '^not ok' out.tap)"
          done
