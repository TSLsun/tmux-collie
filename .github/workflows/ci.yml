name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats parallel shellcheck tmux zsh
      # Ubuntu's packaged fzf predates the bg-transform reload fix (0.73).
      - name: fzf minimum supported version (ubuntu)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/fzf-bin"
          curl -fsSL https://github.com/junegunn/fzf/releases/download/v0.73.0/fzf-0.73.0-linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP/fzf-bin"
          echo "$RUNNER_TEMP/fzf-bin" >> "$GITHUB_PATH"
      # lint is OS-independent and runs on ubuntu only, so macOS skips shellcheck
      - name: deps (macos)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install bats-core parallel tmux fzf
      - run: make ${{ runner.os == 'Linux' && 'check' || 'test' }}
        env:
          COLLIE_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/collie-test-diagnostics
      # workflow_call (including release) runs only the normal suite.
      - name: Repeat readiness paths under parallel load
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/ci.yml@refs/heads/main', github.repository)
        env:
          BATS_TEST_TIMEOUT: 120
          COLLIE_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/collie-test-diagnostics
        run: |
          for attempt in 1 2 3; do
            echo "readiness repetition $attempt"
            time bats --timing --print-output-on-failure --jobs 8 test/agents.bats test/codex.bats test/restore.bats test/dash.bats test/runs.bats
          done
      - name: Preserve tmux diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/collie-test-diagnostics
          if-no-files-found: ignore
          retention-days: 7
