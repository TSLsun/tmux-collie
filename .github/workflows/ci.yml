name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats parallel shellcheck tmux zsh fzf
      # lint is OS-independent and runs on ubuntu only, so macOS skips shellcheck
      - name: deps (macos)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install bats-core parallel tmux fzf
      - run: make ${{ runner.os == 'Linux' && 'check' || 'test' }}
        env:
          COLLIE_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/collie-test-diagnostics
      - name: Measure base readiness paths
        # Base failures are measurement data; only the changed branch gates CI.
        continue-on-error: true
        env:
          BATS_TEST_TIMEOUT: 60
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --depth=1 origin "$BASE_SHA"
            baseline=$(mktemp -d)
            git archive "$BASE_SHA" | tar -x -C "$baseline"
            cd "$baseline"
            time bats --timing --print-output-on-failure --jobs 8 test/agents.bats test/codex.bats test/restore.bats test/dash.bats test/runs.bats
          fi
      - name: Repeat readiness paths under parallel load
        env:
          BATS_TEST_TIMEOUT: 60
          COLLIE_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/collie-test-diagnostics
        run: |
          for attempt in 1 2 3; do
            echo "readiness repetition $attempt"
            time bats --timing --print-output-on-failure --jobs 8 test/agents.bats test/codex.bats test/restore.bats test/dash.bats test/runs.bats
          done
      - name: Preserve tmux diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/collie-test-diagnostics
          if-no-files-found: ignore
          retention-days: 7
