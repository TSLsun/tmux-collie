name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats parallel shellcheck tmux zsh
      # lint is OS-independent and runs on ubuntu only, so macOS skips shellcheck
      - name: deps (macos)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install bats-core parallel tmux
      - run: make ${{ runner.os == 'Linux' && 'check' || 'test' }}
        env:
          COLLIE_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/collie-test-diagnostics
      - name: Preserve tmux diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/collie-test-diagnostics
          if-no-files-found: ignore
          retention-days: 7
